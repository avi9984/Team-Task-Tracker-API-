version: '3.8'

services:
  db:
    image: mongo:6.0-jammy
    container_name: task-tracker-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: task-tracker-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    build: .
    container_name: task-tracker-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://db:27017/task-tracker
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=access_secret
      - JWT_REFRESH_SECRET=refresh_secret
      - ACCESS_TOKEN_EXPIRE=15m
      - REFRESH_TOKEN_EXPIRE=7d
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - db
      - cache
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
